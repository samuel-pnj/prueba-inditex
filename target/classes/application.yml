server:
  port: 5000

external:
  product-service:
    base-url: http://localhost:3001

spring:
  datasource:
    url: jdbc:h2:mem:simprod;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration