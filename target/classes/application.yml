server:
  address: 0.0.0.0
  port: 5000

external:
  product-service:
    base-url: http://localhost:3001

service:
  parallelism: 32           # ajustar según CPUs; subir desde 4 si hardware lo soporta
  detail-timeout-ms: 4000   # ampliar timeout por detalle
  detail-retries: 2

client:
  max-connections: 500      # pool de conexiones salientes
  connect-timeout-ms: 2000
  read-timeout-ms: 10000

spring:
  datasource:
    url: jdbc:h2:mem:simprod;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration